name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev libsdl2-gfx-dev

      - uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      # Same build as the CI Linux job. CodeQL needs a real compile to
      # extract the database; the generated binary is thrown away. Parallelism
      # is capped at 2: with the extractor attached, four concurrent GCC jobs
      # on the biggest translation units exhaust the runner's memory.
      - name: Build for CodeQL
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"
